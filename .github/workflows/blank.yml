name: CI
on:
 push:
  branches: ["main"]
 workflow_dispatch:
jobs:
 build:
  runs-on: ubuntu-latest
  steps: 
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v3
      with:
        python-version: "3.10"
   - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
    
